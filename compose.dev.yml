services:
  web:
    image: docker.io/nginx:1.27
    container_name: future-retro
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
    env_file:
      - ./api/.env
    expose:
      - "3000"
    restart: unless-stopped
